# ============================================================================
# RELATIONSHIPS - Complete Edge Types (73+ total)
# ============================================================================

relationships:

  # ===========================================================================
  # CORE RELATIONSHIPS
  # ===========================================================================

  belongsToSpecies:
    description: "Entity belongs to a species"
    from: ["Genome", "Gene", "Accession", "QTL", "Marker", "Disease", "Trait"]
    to: Species
    module: Core
    source: ["02_Kanak", "04_GeneBank"]

  belongs_to:
    description: "Accession belongs to crop/taxonomy (from 01_Ontology, 04_GeneBank)"
    from: ["Accession"]
    to: ["Crop", "Taxonomy"]
    module: Core
    source: ["01_Ontology", "04_GeneBank"]

  locatedOn:
    description: "Feature located on chromosome/genome"
    from: ["Gene", "QTL", "Marker", "Synteny_Block", "ResistanceGene"]
    to: Chromosome
    module: Core
    source: ["06_schema_lit"]
    properties:
      position_start:
        type: integer
      position_end:
        type: integer

  partOf:
    description: "Entity is part of another (from 06_schema_lit)"
    from: ["Gene", "Chromosome", "ChromosomeSegment"]
    to: ["GeneComplex", "Genome", "Chromosome"]
    module: Core
    source: ["06_schema_lit"]

  contains:
    description: "Entity contains another (from 06_schema_lit)"
    from: ["GeneComplex", "Genome", "Chromosome"]
    to: ["Gene", "Chromosome", "ChromosomeSegment"]
    module: Core
    source: ["06_schema_lit"]

  # ===========================================================================
  # INFRASTRUCTURE RELATIONSHIPS (05_Frank)
  # ===========================================================================

  hasBlastDB:
    description: "Genome has BLAST database"
    from: Genome
    to: BLAST_Database
    module: Infrastructure
    source: ["05_Frank"]

  anchoredTo:
    description: "Dataset anchored to reference genome"
    from: ["Dataset", "VCF_Dataset", "Genotype_Dataset", "Genetic_Map"]
    to: Genome
    module: Infrastructure
    source: ["05_Frank"]

  annotatedOn:
    description: "Gene annotated on genome"
    from: Gene
    to: Genome
    module: Infrastructure
    source: ["05_Frank"]

  hasAnnotation:
    description: "Gene has annotation"
    from: Gene
    to: ["Annotation", "Functional_Annotation"]
    module: Infrastructure
    source: ["05_Frank"]

  alignedTo:
    description: "Genome aligned to another genome (ALIGNED_TO)"
    from: ["Genome", "Dataset", "AlignmentDataset"]
    to: ["Genome", "Dataset", "AlignmentDataset"]
    module: Infrastructure
    source: ["05_Frank"]

  ALIGNED_TO_GENOME:
    description: "Dataset aligned to genome (from 05_Frank)"
    from: ["Dataset", "AlignmentDataset"]
    to: ["GenomeDataset"]
    module: Infrastructure
    source: ["05_Frank"]

  DEFINED_IN:
    description: "Entity defined in dataset (from 05_Frank)"
    from: ["Dataset", "QTL"]
    to: ["Dataset", "GeneticMapdataset", "GenomeDataset"]
    module: Infrastructure
    source: ["05_Frank"]

  partOfGenome:
    description: "Chromosome part of genome"
    from: Chromosome
    to: Genome
    module: Infrastructure
    source: ["05_Frank"]

  hasBlastHit:
    description: "Query has BLAST hit"
    from: BLAST_Result
    to: Gene
    module: Infrastructure
    source: ["05_Frank"]

  # NOTE: hasConfidence and isReference are PROPERTIES on nodes, not relationships
  # - Annotation.confidence_level (enum: AnnotationConfidence)  
  # - Genome.is_reference (boolean)
  # They were previously listed here as edges but have been moved to entity fields

  hasCurator:
    description: "Dataset has curator (from 05_Frank)"
    from: ["Dataset", "GenomeDataset", "GeneticMapdataset", "VCF_Dataset"]
    to: Curator
    module: Infrastructure
    source: ["05_Frank"]

  hasDatasetAccession:
    description: "Dataset has accession (from 05_Frank)"
    from: ["Dataset", "GenomeDataset"]
    to: DatasetAccession
    module: Infrastructure
    source: ["05_Frank"]

  hasProject:
    description: "Dataset has project (from 05_Frank, 251027_Metadata)"
    from: ["Dataset", "GenomeDataset", "VCF_Dataset"]
    to: Project
    module: Infrastructure
    source: ["05_Frank", "251027_Metadata"]

  # ===========================================================================
  # CROP IMPROVEMENT RELATIONSHIPS (02_Kanak + 06_schema_lit)
  # ===========================================================================

  associatedWithTrait:
    description: "QTL/Marker associated with trait"
    from: ["QTL", "Marker", "Gene", "MTA"]
    to: Trait
    module: Crop_Improvement
    source: ["06_schema_lit"]
    properties:
      p_value:
        type: float
      effect_size:
        type: float

  confersResistanceTo:
    description: "Gene confers resistance to disease"
    from: ["Gene", "ResistanceGene"]
    to: Disease
    module: Crop_Improvement
    source: ["06_schema_lit"]
    properties:
      resistance_type:
        type: string

  effectiveAgainst:
    description: "Gene effective against pathogen/race (from 06_schema_lit)"
    from: ["ResistanceGene", "Gene"]
    to: ["Pathogen", "PathogenRace", "Pathotype"]
    module: Crop_Improvement
    source: ["06_schema_lit"]

  broadlyEffectiveAgainst:
    description: "Gene broadly effective (from 06_schema_lit)"
    from: ["ResistanceGene"]
    to: ["Pathogen"]
    module: Crop_Improvement
    source: ["06_schema_lit"]

  raceSpecificAgainst:
    description: "Gene race-specific (from 06_schema_lit)"
    from: ["ResistanceGene", "ChromosomeSegment"]
    to: ["PathogenRace"]
    module: Crop_Improvement
    source: ["06_schema_lit"]

  susceptibleTo:
    description: "Cultivar susceptible to pathogen (from 06_schema_lit)"
    from: ["Cultivar", "Accession"]
    to: ["Pathotype", "PathogenRace"]
    module: Crop_Improvement
    source: ["06_schema_lit"]

  avirulentToGene:
    description: "Pathogen avirulent to gene (from 06_schema_lit)"
    from: ["PathogenRace", "Pathotype"]
    to: ResistanceGene
    module: Crop_Improvement
    source: ["06_schema_lit"]

  virulentToGene:
    description: "Pathogen virulent to gene (from 06_schema_lit)"
    from: ["PathogenRace", "Pathotype"]
    to: ResistanceGene
    module: Crop_Improvement
    source: ["06_schema_lit"]

  relatedToTrait:
    description: "Gene related to trait (general)"
    from: Gene
    to: Trait
    module: Crop_Improvement
    source: ["06_schema_lit"]

  hasSyntenyWith:
    description: "Chromosome/genome has synteny"
    from: ["Chromosome", "Genome"]
    to: ["Chromosome", "Genome"]
    module: Crop_Improvement
    source: ["05_Frank"]
    properties:
      block_id:
        type: string

  containsMarker:
    description: "Dataset contains marker"
    from: Dataset
    to: Marker
    module: Crop_Improvement
    source: ["05_Frank"]

  linkedToGene:
