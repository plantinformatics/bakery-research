# ============================================================================
# PRETZEL GRAND SCHEMA - UNIFIED KNOWLEDGE GRAPH v2.1
# ============================================================================
# Version: 2.1
# Created: 2025-01-02
# Updated: 2026-02-11 (added 251027_Metadata infrastructure fields)
#
# SOURCES MERGED:
# - 01_Ontology (Genebank base ontology)
# - 02_Kanak (Disease + Crop Improvement)
# - 04_GeneBank (Genebank/Germplasm)
# - 05_Frank (Genomics Infrastructure)
# - 06_schema_lit (Literature/Provenance)
# - 251027_Metadata (Infrastructure metadata fields update)
#
# COVERAGE: 
# - 39 evaluation questions (100%)
# - 50+ source nodes (100%)
# - 46+ source edges (100%)
# - 39/39 infrastructure metadata fields (100%)
#
# MODULES:
# - Core (shared identifiers)
# - Infrastructure (genomes, genes, annotations, datasets)
# - Crop_Improvement (traits, QTLs, markers, disease, resistance)
# - Genebank (accessions, genotypes, germplasm)
# - Provenance (publications, evidence, studies)
# ============================================================================

version: "2.1"
last_updated: "2026-02-11"
ontology_namespace: "https://pretzel.plantinformatics.io/schema#"
ontology_prefix: "ptz"

# ============================================================================
# ENUMS - Controlled vocabularies
# ============================================================================

enums:

  # ---------------------------------------------------------------------------
  # SPECIES / HOST
  # ---------------------------------------------------------------------------
  
  SpeciesName:
    - Hordeum vulgare           # Barley
    - Hordeum vulgare subsp. spontaneum  # Wild barley
    - Hordeum bulbosum          # Bulbous barley
    - Triticum aestivum         # Bread wheat
    - Triticum turgidum         # Durum wheat
    - Triticum monococcum       # Einkorn
    - Aegilops tauschii         # D genome donor
    - Cicer arietinum           # Chickpea
    - Lens culinaris            # Lentil
    - Oryza sativa              # Rice
    - Secale cereale            # Rye

  # ---------------------------------------------------------------------------
  # CHROMOSOMES
  # ---------------------------------------------------------------------------
  
  BarleyChromosome:
    - 1H
    - 2H
    - 3H
    - 4H
    - 5H
    - 6H
    - 7H

  WheatChromosome:
    - 1A
    - 2A
    - 3A
    - 4A
    - 5A
    - 6A
    - 7A
    - 1B
    - 2B
    - 3B
    - 4B
    - 5B
    - 6B
    - 7B
    - 1D
    - 2D
    - 3D
    - 4D
    - 5D
    - 6D
    - 7D

  ChromosomeArm:
    - S   # Short arm
    - L   # Long arm

  # ---------------------------------------------------------------------------
  # GENOME/ASSEMBLY
  # ---------------------------------------------------------------------------
  
  ReferenceGenome:
    # Barley
    - MorexV3
    - MorexV2
    - RGT_Planet
    # Wheat
    - IWGSC_RefSeq_v2.1
    - IWGSC_RefSeq_v1.0
    - Chinese_Spring
    - ArinaLrFor
    - Mace
    - Lancer
    - Norin61
    - Spelt_PI190962
    - SY_Mattis
    # Chickpea
    - CDCFrontier_gnm3
    - CDC_Frontier_v1.0
    # Lentil
    - CDCRedberry_v2.0

  AssemblyLevel:
    - chromosome
    - scaffold
    - contig

  # ---------------------------------------------------------------------------
  # ANNOTATION
  # ---------------------------------------------------------------------------
  
  AnnotationConfidence:
    - high_confidence
    - low_confidence
    - predicted
    - curated

  AnnotationType:
    - gene_model
    - functional_annotation
    - repeat_annotation
    - synteny_block

  # ---------------------------------------------------------------------------
  # MARKERS
  # ---------------------------------------------------------------------------
  
  MarkerType:
    - SNP
    - SSR
    - KASP
    - DArT
    - RFLP
    - STS
    - CAPS
    - GBS

  SNPArrayName:
    - Wheat_Barley_40K_v1.1
    - AGG_Barley_50K
    - AGG_Wheat_90K
    - AGG_Pulses_30K
    - Infinium_iSelect_90K

  MarkerPlatform:
    - Illumina_Infinium
    - Illumina_GoldenGate
    - DArTseq
    - GBS
    - Axiom

  # ---------------------------------------------------------------------------
  # TRAITS & DISEASE
  # ---------------------------------------------------------------------------
  
  TraitCategory:
    - disease_resistance
    - yield
    - phenology
    - quality
    - agronomic
    - abiotic_stress

  DiseaseType:
    - leaf_rust
    - stripe_rust
    - stem_rust
    - crown_rust
    - powdery_mildew
    - fusarium_head_blight
    - septoria
    - barley_yellow_dwarf_virus
    - scald

  ResistanceStage:
    - seedling
    - adult_plant
    - all_stage
    - partial

  EffectSize:
    - major
    - minor

  # ---------------------------------------------------------------------------
  # PATHOGENS
  # ---------------------------------------------------------------------------
  
  PathogenSpecies:
    - Puccinia striiformis f. sp. hordei   # Barley stripe rust
    - Puccinia hordei                       # Barley leaf rust
    - Puccinia striiformis f. sp. tritici  # Wheat stripe rust
    - Puccinia triticina                    # Wheat leaf rust
    - Puccinia graminis f. sp. tritici     # Wheat stem rust
    - Blumeria graminis f. sp. hordei      # Barley powdery mildew
    - Blumeria graminis f. sp. tritici     # Wheat powdery mildew
    - Rhynchosporium commune
    - Rhynchosporium secalis

  # ---------------------------------------------------------------------------
  # GENOTYPE/ACCESSION
  # ---------------------------------------------------------------------------
  
  AccessionType:
    - Cultivar
    - Landrace
    - Wild
    - breeding_line
    - RIL
    - DH
    - NIL
    - introgression_line
    - differential_line

  GenotypeDataType:
    - raw
    - filled_in
    - imputed
    - phased

  VCFType:
    - pangenome
    - single_sample
    - multi_sample

  # ---------------------------------------------------------------------------
  # POPULATION
  # ---------------------------------------------------------------------------
  
  PopulationType:
    - RIL
    - DH
    - F2
    - F3
    - F4
    - BC1F1
    - NAM
    - MAGIC
    - HEB
    - diversity_panel
    - GWAS_panel

  # ---------------------------------------------------------------------------
  # RESISTANCE GENES
  # ---------------------------------------------------------------------------
  
  ResistanceGenePrefix:
    - Rph   # Barley leaf rust
    - Rps   # Barley stripe rust
    - rpg   # Barley stem rust (recessive)
    - Rpg   # Barley stem rust (dominant)
    - Mla   # Barley powdery mildew
    - Lr    # Wheat leaf rust
    - Yr    # Wheat stripe rust
    - Sr    # Wheat stem rust
    - Pm    # Wheat powdery mildew
    - Rrs
    - Rh
    - Vrn

  GeneType:
    - NLR
    - kinase
    - transporter
    - transcription_factor
    - unknown

  # ---------------------------------------------------------------------------
  # PROVENANCE
  # ---------------------------------------------------------------------------
  
  EvidenceCode:
    - experimental
    - author_statement
    - curator_inference
    - computational

# ============================================================================
# ENTITIES - Complete Node Types (67 total)
# ============================================================================

entities:

  # ===========================================================================
  # CORE MODULE (shared across all)
  # ===========================================================================

  Species:
    description: "Organism species"
    module: Core
    source: ["02_Kanak", "04_GeneBank"]
    fields:
      species_id:
        type: string
        required: true
        example: "NCBITaxon:4513"
      name:
        type: enum
        enum_ref: SpeciesName
        required: true
      common_name:
        type: string
        required: false
        example: "barley"
      ncbi_taxon_id:
        type: integer
        required: false
        example: 4513

  Host:
    description: "Host plant species (from 02_Kanak)"
    module: Core
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "Barley"
      species:
        type: string
        required: false
        example: "Hordeum vulgare"
      Host_othername:
        type: string
        required: false

  NonHost:
    description: "Non-host species for gene transfer (from 02_Kanak)"
    module: Core
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "Hordeum bulbosum"
      species:
        type: string
        required: false
      NonHost_othername:
        type: string
        required: false

  Crop:
    description: "Crop type (from 01_Ontology, 04_GeneBank)"
    module: Core
    source: ["01_Ontology", "04_GeneBank"]
    fields:
      name:
        type: string
        required: true
        example: "Barley"

  Taxonomy:
    description: "Taxonomic classification (from 01_Ontology, 04_GeneBank)"
    module: Core
    source: ["01_Ontology", "04_GeneBank"]
    fields:
      name:
        type: string
        required: true
        example: "Hordeum vulgare L."

  # ===========================================================================
  # INFRASTRUCTURE MODULE (05_Frank)
  # ===========================================================================

  Genome:
    description: "Reference genome assembly"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      genome_id:
        type: string
        required: true
        example: "MorexV3"
      name:
        type: string
        required: true
      version:
        type: string
        required: false
      is_reference:
        type: boolean
        required: false
        default: false
      assembly_level:
        type: enum
        enum_ref: AssemblyLevel
        required: false
      fasta_url:
        type: string
        required: false
      gff_url:
        type: string
        required: false

  GenomeDataset:
    description: "Genome dataset container (from 05_Frank, 251027_Metadata)"
    module: Infrastructure
    source: ["05_Frank", "251027_Metadata"]
    fields:
      id:
        type: string
        required: true
      shortName:
        type: string
        required: false
      displayName:
        type: string
        required: false
      type:
        type: string
        required: false
      species:
        type: string
        required: false
      crop:
        type: string
        required: false
      publication:
        type: string
        required: false
      dataSource:
        type: string
        required: false
      categories:
        type: string
        required: false
      tags:
        type: string
        required: false
      comments:
        type: string
        required: false
      panbarlexName:
        type: string
        required: false
        description: "Name used in the PanBARLEX database"
      accessionName:
        type: string
        required: false
        description: "Name of the accession sequenced (from 251027_Metadata)"
      ebiEnaId:
        type: string
        required: false
        description: "ENA accession for the genome assembly (from 251027_Metadata)"

  Assembly:
    description: "Genome assembly version"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      assembly_id:
        type: string
        required: true
      name:
        type: string
        required: true
      version:
        type: string
        required: false
      accession:
        type: string
        required: false
        example: "GCA_904849725.1"
      assembly_level:
        type: enum
        enum_ref: AssemblyLevel
        required: false

  Chromosome:
    description: "Chromosome or linkage group"
    module: Infrastructure
    source: ["02_Kanak", "05_Frank"]
    fields:
      chromosome_id:
        type: string
        required: true
        example: "5H"
      name:
        type: string
        required: true
      Chromosome_othername:
        type: string
        required: false
      length_bp:
        type: integer
        required: false
      length_cM:
        type: float
        required: false

  ChromosomeSegment:
    description: "Chromosome arm or segment (from 02_Kanak)"
    module: Infrastructure
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "QTL 2HS"
      arm:
        type: enum
        enum_ref: ChromosomeArm
        required: false
      ChromosomeSegment_othername:
        type: string
        required: false
      doc:
        type: string
        required: false

  Gene:
    description: "Gene or gene model"
    module: Infrastructure
    source: ["01_Ontology", "02_Kanak", "05_Frank"]
    fields:
      gene_id:
        type: string
        required: true
        example: "HORVU.MOREX.r3.5HG0419860"
      name:
        type: string
        required: false
        example: "VRN1"
      symbol:
        type: string
        required: false
      Gene_othername:
        type: string
        required: false
      description:
        type: string
        required: false
      note:
        type: string
        required: false
      position_start:
        type: integer
        required: false
      position_end:
        type: integer
        required: false
      strand:
        type: string
        required: false
        example: "+"

  GeneComplex:
    description: "Gene complex or cluster (from 02_Kanak)"
    module: Infrastructure
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "RMRL"
      GeneComplex_othername:
        type: string
        required: false
      note:
        type: string
        required: false
      doc:
        type: string
        required: false

  CandidateGene:
    description: "Candidate gene from fine mapping (from 06_schema_lit)"
    module: Infrastructure
    source: ["06_schema_lit"]
    fields:
      name:
        type: string
        required: true
      gene_id:
        type: string
        required: false
      functional_annotation:
        type: string
        required: false
      evidence_type:
        type: string
        required: false

  Annotation:
    description: "Gene or feature annotation"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      annotation_id:
        type: string
        required: true
      type:
        type: enum
        enum_ref: AnnotationType
        required: false
      confidence_level:
        type: enum
        enum_ref: AnnotationConfidence
        required: false
      source:
        type: string
        required: false

  Functional_Annotation:
    description: "Functional annotation (GO, KEGG, InterPro)"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      annotation_id:
        type: string
        required: true
      go_terms:
        type: list
        item_type: string
        required: false
      kegg_pathway:
        type: string
        required: false
      interpro_id:
        type: string
        required: false
      description:
        type: string
        required: false

  FunctionDescriptionText:
    description: "Function description text with embeddings (from 05_Frank)"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      text:
        type: string
        required: false
      title:
        type: string
        required: false
      embedding:
        type: list
        item_type: float
        required: false

  BLAST_Database:
    description: "BLAST database for sequence search"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      blast_db_id:
        type: string
        required: true
      name:
        type: string
        required: true
      enabled:
        type: boolean
        required: false
        default: true
      db_type:
        type: string
        required: false
        example: "nucleotide"

  BLAST_Result:
    description: "BLAST search result"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      result_id:
        type: string
        required: true
      query_sequence:
        type: string
        required: false
      e_value:
        type: float
        required: false
      identity_percent:
        type: float
        required: false
      alignment_length:
        type: integer
        required: false

  Alignment:
    description: "Genome-to-genome alignment"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      alignment_id:
        type: string
        required: true
      method:
        type: string
        required: false
        example: "minimap2"
      identity_percent:
        type: float
        required: false

  AlignmentDataset:
    description: "Alignment dataset (from 05_Frank, 251027_Metadata)"
    module: Infrastructure
    source: ["05_Frank", "251027_Metadata"]
    fields:
      id:
        type: string
        required: true
      shortName:
        type: string
        required: false
      displayName:
        type: string
        required: false
      alignmentType:
        type: string
        required: false
        description: "Type of the Alignment dataset (Marker, Gene) (from 251027_Metadata)"
      species:
        type: string
        required: false
      genomeId:
        type: string
        required: false
        description: "ID of the genome aligned against (from 251027_Metadata)"
      markerType:
        type: string
        required: false
        description: "Type of marker (SSR, 90K, SNP) (from 251027_Metadata)"

  Dataset:
    description: "General dataset container"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      id:
        type: string
        required: true
      shortName:
        type: string
        required: false
      displayName:
        type: string
        required: false
      type:
        type: string
        required: false
      species:
        type: string
        required: false
      crop:
        type: string
        required: false
      platform:
        type: string
        required: false
      markerType:
        type: string
        required: false
      populationType:
        type: string
        required: false
      parentNames:
        type: string
        required: false
      publication:
        type: string
        required: false
      categories:
        type: string
        required: false
      tags:
        type: string
        required: false
      comments:
        type: string
        required: false
      definedIn:
        type: string
        required: false
      genomeId:
        type: string
        required: false
      dataSource:
        type: string
        required: false
      licensingOfOriginalData:
        type: string
        required: false

  GeneticMapdataset:
    description: "Genetic map dataset (from 05_Frank)"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      id:
        type: string
        required: true
      shortName:
        type: string
        required: false
      displayName:
        type: string
        required: false
      type:
        type: string
        required: false
      species:
        type: string
        required: false
      crop:
        type: string
        required: false
      markerType:
        type: string
        required: false
      populationType:
        type: string
        required: false
      parentNames:
        type: string
        required: false
      publication:
        type: string
        required: false
      categories:
        type: string
        required: false

  DatasetAccession:
    description: "Accession linked to dataset (from 05_Frank, 251027_Metadata)"
    module: Infrastructure
    source: ["05_Frank", "251027_Metadata"]
    fields:
      accessionName:
        type: string
        required: true
      aliases:
        type: string
        required: false
        description: "Aliases of the accession (from 251027_Metadata)"
      pedigree:
        type: string
        required: false
      features:
        type: string
        required: false
      origin:
        type: string
        required: false
      marketClass:
        type: string
        required: false
      growthHabit:
        type: string
        required: false
      yearOfRelease:
        type: string
        required: false

  Curator:
    description: "Data curator (from 05_Frank)"
    module: Infrastructure
    source: ["05_Frank"]
    fields:
      name:
        type: string
        required: true
      email:
        type: string
        required: false
      organization:
        type: string
        required: false

  Project:
    description: "Research project (from 05_Frank, 251027_Metadata)"
    module: Infrastructure
    source: ["05_Frank", "251027_Metadata"]
    fields:
      project_id:
        type: string
        required: true
        description: "Project ID used to link between Project and other types (from 251027_Metadata)"
      name:
        type: string
        required: true
      description:
        type: string
        required: false
      funding_source:
        type: string
        required: false

  # ===========================================================================
  # CROP IMPROVEMENT MODULE (02_Kanak + 06_schema_lit)
  # ===========================================================================

  Trait:
    description: "Phenotypic trait"
    module: Crop_Improvement
    source: ["02_Kanak", "06_schema_lit"]
    fields:
      trait_id:
        type: string
        required: true
        example: "CO_321:0000001"
      name:
        type: string
        required: true
        example: "grain yield"
      category:
        type: enum
        enum_ref: TraitCategory
        required: false
      ontology_term:
        type: string
        required: false

  AgronomicTrait:
    description: "Agronomic trait (from 02_Kanak)"
    module: Crop_Improvement
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "Tiller Number"
      AgronomicTrait_othername:
        type: string
        required: false
      doc:
        type: string
        required: false

  Disease:
    description: "Plant disease"
    module: Crop_Improvement
    source: ["02_Kanak"]
    fields:
      disease_id:
        type: string
        required: true
      name:
        type: string
        required: true
        example: "Stripe/Yellow rust"
      type:
        type: enum
        enum_ref: DiseaseType
        required: false
      Disease_othername:
        type: string
        required: false
      doc:
        type: string
        required: false

  ResistanceGene:
    description: "Disease resistance gene (from 02_Kanak, 06_schema_lit)"
    module: Crop_Improvement
    source: ["02_Kanak", "06_schema_lit"]
    fields:
      name:
        type: string
        required: true
        example: "Rph14"
      ResistanceGene_othername:
        type: string
        required: false
      prefix:
        type: enum
        enum_ref: ResistanceGenePrefix
        required: false
      gene_number:
        type: string
        required: false
      allele:
        type: string
        required: false
      gene_type:
        type: enum
        enum_ref: GeneType
        required: false
      chromosome:
        type: string
        required: false
      chromosome_arm:
        type: enum
        enum_ref: ChromosomeArm
        required: false
      position_cM:
        type: float
        required: false
      position_start_Mb:
        type: float
        required: false
      position_end_Mb:
        type: float
        required: false
      reference_genome:
        type: enum
        enum_ref: ReferenceGenome
        required: false
      source_species:
        type: string
        required: false
      resistance_stage:
