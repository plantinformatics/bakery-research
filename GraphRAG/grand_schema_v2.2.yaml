    module: Crop_Improvement
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "Ug99"
      PathogenLineage_othername:
        type: string
        required: false
      doc:
        type: string
        required: false

  Pathotype:
    description: "Pathotype (from 02_Kanak)"
    module: Crop_Improvement
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "200Pâˆ’"
      pathotypeName:
        type: string
        required: false
      rustCultureID:
        type: integer
        required: false
      origin:
        type: string
        required: false
      Pathotype_othername:
        type: string
        required: false
      doc:
        type: string
