        required: true
      ResistanceGene_Ml_Gene_othername:
        type: string
        required: false

  ResistanceType:
    description: "Type of resistance (from 02_Kanak)"
    module: Crop_Improvement
    source: ["02_Kanak"]
    fields:
      name:
        type: string
        required: true
        example: "Adult Plant Resistance"
      ResistanceType_othername:
        type: string
        required: false
      doc:
